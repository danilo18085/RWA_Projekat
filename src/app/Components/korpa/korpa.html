    <div class="korpa">
        <div class="naziv_korpe"></div>
        <div class="igrice_u_korpi">
            @for(jedan_element of (niz_elemenata$ | async); track jedan_element.id)
            {
                <app-element-u-korpi [element]="jedan_element"></app-element-u-korpi>
            }
        </div>
        <div class="cena_kontejner visina">
            <h3>Ukupno:</h3>
            <h3>{{ ukupna_cena$ | async | number: '1.2-2' }}$</h3>
        </div>
        <div class="divider_linija max_velicina"></div>

        <button (click)="otvoriFormu()">Plaćanje</button>

        @if (prikaziFormu()) 
        {
        <div class="overlay">
        <div class="modal">
            <form [formGroup]="forma" (ngSubmit)="sacuvaj()">
                <input type="text" formControlName="imeIprezime" placeholder="Ime i Prezime" />
                <input type="text" formControlName="email" placeholder="Email adresa" />
                <input type="text" formControlName="adresaIsporuke" placeholder="Adresa isporuke" />
                <select formControlName="nacinPlacanja" class="selekt-element">
                  <option value="" disabled selected>Način plaćanja</option>
                  <option value="KARTICA">Kartica</option>
                  <option value="KEŠ">Keš</option>
                </select>
                <div class="dugmici">
                  <button type="button" (click)="zatvoriFormu()">Otkaži</button>
                  <button type="submit">Poruči</button>
                </div>
            </form>
        </div>
        </div>
        }
    </div>
